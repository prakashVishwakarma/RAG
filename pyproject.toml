[project]
name = "rag"
version = "0.1.0"
description = "RAG assistant that answers questions about company policy PDFs using LangChain, Jina embeddings, Chroma and Groq"
readme = "README.md"
authors = [
    { name = "Prakash Vishwakarma", email = "prksvsvkrma@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
]

